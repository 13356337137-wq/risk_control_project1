# 放到 /etc/nginx/sites-available/risk-control 再软链到 sites-enabled
server {
    listen 80;
    server_name _;  # 换成你的域名

    client_max_body_size 25m;   # 上传上限：PDF 20MB / 图片 10MB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /opt/risk-control/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 银行侧挂在 /bank/
    location /bank/ {
        alias /opt/risk-control/bank/;
        try_files $uri $uri/ /bank/index.html;
        # 生产建议先加口令，等登录做好再撤
        # auth_basic "bank only";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
